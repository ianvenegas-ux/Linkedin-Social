<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a66c2">
  <title>Lili Social · Lilian Trade</title>
  <style>
    :root { --blue:#0a66c2; --blue-dark:#004182; --ink:#172b4d; --muted:#6b778c; --line:#dfe3e8; --bg:#f4f6f8; --card:#fff; --green:#16834b; --amber:#a15c00; --red:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
    button,input,textarea { font:inherit; }
    button { cursor:pointer; }
    .hidden { display:none !important; }
    .login { min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(140deg,#eef6ff 0%,#f7f9fb 52%,#eaf1f8 100%); }
    .login-card { width:min(420px,100%); background:#fff; border:1px solid var(--line); border-radius:16px; padding:32px; box-shadow:0 18px 50px #17324d16; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:750; letter-spacing:-.02em; }
    .brand-mark { display:grid; place-items:center; width:38px; height:38px; border-radius:10px; color:#fff; background:var(--blue); font-weight:800; }
    .login-card h1 { margin:28px 0 6px; font-size:25px; letter-spacing:-.03em; }
    .login-card p { color:var(--muted); margin:0 0 24px; }
    label { display:block; font-weight:650; margin:14px 0 7px; }
    input,textarea { width:100%; border:1px solid #b8c0cc; border-radius:8px; background:#fff; color:var(--ink); padding:11px 12px; outline:none; }
    input:focus,textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px #0a66c21c; }
    textarea { resize:vertical; min-height:170px; }
    .primary,.secondary,.danger { border:0; border-radius:8px; padding:10px 15px; font-weight:700; }
    .primary { background:var(--blue); color:#fff; }
    .primary:hover { background:var(--blue-dark); }
    .secondary { background:#e8f1fb; color:var(--blue-dark); }
    .danger { background:#fff0ef; color:var(--red); }
    .full { width:100%; margin-top:20px; }
    .error { margin-top:14px; padding:10px 12px; border-radius:8px; background:#fff0ef; color:var(--red); }
    .app { min-height:100vh; }
    .topbar { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
    .topbar .brand-mark { width:32px; height:32px; border-radius:8px; font-size:14px; }
    .account { display:flex; align-items:center; gap:13px; color:var(--muted); }
    .avatar { width:34px; height:34px; border-radius:50%; background:#d9e8f7; color:var(--blue-dark); display:grid; place-items:center; font-weight:800; }
    .shell { display:grid; grid-template-columns:220px minmax(0,1fr); min-height:calc(100vh - 64px); }
    aside { padding:24px 14px; background:#fff; border-right:1px solid var(--line); }
    .nav-label { margin:6px 12px 10px; color:var(--muted); text-transform:uppercase; font-size:11px; font-weight:800; letter-spacing:.08em; }
    .nav { display:grid; gap:4px; }
    .nav button { border:0; text-align:left; background:transparent; color:#42526e; border-radius:8px; padding:11px 12px; font-weight:650; }
    .nav button:hover,.nav button.active { background:#e8f1fb; color:var(--blue-dark); }
    main { padding:28px clamp(18px,4vw,48px) 48px; min-width:0; }
    .page-head { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:22px; }
    .eyebrow { margin:0 0 5px; color:var(--blue); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
    h2 { margin:0; font-size:26px; letter-spacing:-.035em; }
    .subtle { color:var(--muted); }
    .actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .workspace { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(330px,.95fr); gap:20px; align-items:start; }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 3px 12px #17324d08; }
    .panel-head { padding:17px 19px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .panel-head h3 { margin:0; font-size:16px; }
    .panel-body { padding:19px; }
    .status { border-radius:999px; padding:4px 9px; font-size:12px; font-weight:750; background:#eef1f5; color:#42526e; }
    .status.draft { background:#fff4d6; color:#8a4b00; }
    .status.approved { background:#e3fcef; color:var(--green); }
    .status.scheduled { background:#e8f1fb; color:var(--blue-dark); }
    .status.published { background:#e3fcef; color:var(--green); }
    .field-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .counter { text-align:right; margin-top:5px; font-size:12px; color:var(--muted); }
    .drop { border:1.5px dashed #9aa8b8; border-radius:10px; padding:16px; display:flex; align-items:center; gap:12px; color:#42526e; background:#fafbfd; }
    .drop:hover { border-color:var(--blue); background:#f5faff; }
    .drop input { display:none; }
    .drop-icon { display:grid; place-items:center; width:38px; height:38px; border-radius:9px; background:#e8f1fb; color:var(--blue); font-size:18px; }
    .material { display:flex; align-items:center; gap:12px; margin-top:12px; padding:10px; border:1px solid var(--line); border-radius:8px; }
    .material img { width:52px; height:52px; object-fit:cover; border-radius:6px; background:#edf1f5; }
    .material-title { min-width:0; flex:1; }
    .material-title strong { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .material-title span { font-size:12px; color:var(--muted); }
    .preview-wrap { background:#f7f9fb; padding:26px 18px; min-height:520px; display:grid; place-items:start center; }
    .linkedin-card { width:min(100%,510px); background:#fff; border:1px solid #d7dce2; border-radius:8px; overflow:hidden; box-shadow:0 4px 14px #1b273508; }
    .li-head { display:flex; gap:10px; padding:16px 16px 10px; align-items:center; }
    .li-logo { width:42px; height:42px; display:grid; place-items:center; border-radius:5px; background:#123c61; color:#fff; font-size:12px; font-weight:800; }
    .li-name { font-weight:750; font-size:14px; }
    .li-meta { color:#6b778c; font-size:12px; }
    .li-body { padding:0 16px 15px; white-space:pre-wrap; overflow-wrap:anywhere; min-height:80px; }
    .li-image { width:100%; aspect-ratio:1.7/1; object-fit:cover; background:linear-gradient(135deg,#dce8f3,#f4f7fa); }
    .li-placeholder { display:grid; place-items:center; color:#8794a5; font-size:13px; }
    .li-actions { border-top:1px solid #edf0f2; display:flex; justify-content:space-around; padding:10px; color:#5e6c84; font-size:13px; font-weight:700; }
    .list-panel { margin-top:20px; }
    .post-list { display:grid; gap:8px; }
    .post-row { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:18px; align-items:center; padding:14px 17px; border-top:1px solid #edf0f2; }
    .post-row:first-child { border-top:0; }
    .post-row button { border:0; background:transparent; color:var(--blue); font-weight:700; }
    .post-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; }
    .post-date { color:var(--muted); font-size:12px; }
    .empty { color:var(--muted); text-align:center; padding:32px 10px; }
    .toast { position:fixed; right:22px; bottom:22px; max-width:360px; padding:13px 16px; border-radius:9px; background:#172b4d; color:#fff; box-shadow:0 9px 25px #172b4d30; z-index:20; }
    .toast.bad { background:#8e211b; }
    .calendar { display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; }
    .day { min-height:126px; padding:10px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
    .day:nth-child(7n) { border-right:0; }
    .day-number { color:var(--muted); font-size:12px; }
    .event { margin-top:9px; padding:7px; border-radius:6px; background:#e8f1fb; color:var(--blue-dark); font-size:12px; font-weight:650; }
    @media (max-width:900px) { .workspace { grid-template-columns:1fr; } .preview-wrap { min-height:0; } }
    @media (max-width:680px) { .topbar { padding:0 15px; } .topbar .account span { display:none; } .shell { display:block; } aside { padding:8px 12px; border-right:0; border-bottom:1px solid var(--line); overflow:auto; } .nav { display:flex; min-width:max-content; } .nav-label { display:none; } main { padding:22px 13px 40px; } .page-head { display:block; } .actions { margin-top:14px; justify-content:flex-start; } .field-row { grid-template-columns:1fr; gap:0; } .post-row { grid-template-columns:minmax(0,1fr) auto; gap:9px; } .post-date { display:none; } }
  </style>
</head>
<body>
  <section id="loginView" class="login">
    <div class="login-card">
      <div class="brand"><span class="brand-mark">LT</span><span>Lili Social</span></div>
      <h1>Publicaciones de Lilian Trade</h1>
      <p>Espacio interno para revisar, programar y publicar contenido en LinkedIn.</p>
      <form id="loginForm">
        <label for="email">Correo</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="primary full" type="submit">Entrar</button>
      </form>
      <div id="loginError" class="error hidden"></div>
    </div>
  </section>

  <section id="appView" class="app hidden">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">LT</span><span>Lili Social</span></div>
      <div class="account"><span id="accountEmail"></span><span id="avatar" class="avatar">IV</span><button id="logoutBtn" class="secondary">Salir</button></div>
    </header>
    <div class="shell">
      <aside>
        <div class="nav-label">Contenido</div>
        <nav class="nav">
          <button class="active" data-view="composer">Crear publicación</button>
          <button data-view="drafts">Borradores</button>
          <button data-view="calendar">Calendario</button>
          <button data-view="materials">Materiales</button>
        </nav>
      </aside>
      <main>
        <div id="mainContent"></div>
      </main>
    </div>
  </section>
  <div id="toast" class="toast hidden"></div>

  <script>
    const SUPABASE_URL = "https://qjvaqxjmxydqjrcwuavp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_0MfifeAp9qwvXInTATz2Xw_Xc4tHu0R";
    const FUNCTION_BASE = SUPABASE_URL + "/functions/v1";
    const SESSION_KEY = "lili_social_session";
    const ORG_NAME = "Lilian Trade";
    let session = null;
    let user = null;
    let posts = [];
    let media = [];
    let accounts = [];
    let activePost = null;
    let activeImage = null;
    let currentView = "composer";
    let toastTimer = null;

    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const fmt = (value) => value ? new Intl.DateTimeFormat("es-CL", { dateStyle:"medium", timeStyle:"short" }).format(new Date(value)) : "";
    const apiHeaders = (extra = {}) => ({ apikey: SUPABASE_KEY, Authorization: "Bearer " + (session?.access_token || SUPABASE_KEY), ...extra });

    async function request(path, options = {}) {
      const response = await fetch(SUPABASE_URL + path, { ...options, headers: apiHeaders(options.headers || {}) });
      const text = await response.text();
      let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
      if (!response.ok) throw new Error(data?.message || data?.error_description || data?.error || data?.hint || (typeof data === "string" ? data : "HTTP " + response.status));
      return data;
    }

    async function login(email, password) {
      const response = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", { method:"POST", headers:{ apikey:SUPABASE_KEY, "Content-Type":"application/json" }, body:JSON.stringify({ email, password }) });
      const data = await response.json().catch(() => null);
      if (!response.ok || !data?.access_token) throw new Error(data?.error_description || data?.msg || "No se pudo iniciar sesión");
      session = data; localStorage.setItem(SESSION_KEY, JSON.stringify(data));
      user = data.user;
    }

    async function restoreSession() {
      try {
        const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
        if (!saved?.access_token) return false;
        const response = await fetch(SUPABASE_URL + "/auth/v1/user", { headers:{ apikey:SUPABASE_KEY, Authorization:"Bearer " + saved.access_token } });
        if (!response.ok) throw new Error("expired");
        session = saved; user = await response.json(); return true;
      } catch { localStorage.removeItem(SESSION_KEY); return false; }
    }

    async function loadData() {
      const [postData, mediaData, accountData] = await Promise.all([
        request("/rest/v1/social_posts?select=*&platform=eq.linkedin&order=updated_at.desc"),
        request("/rest/v1/social_media?select=*&order=created_at.desc"),
        request("/rest/v1/social_accounts?select=*&platform=eq.linkedin")
      ]);
      posts = postData || []; media = mediaData || []; accounts = accountData || [];
      if (!activePost) activePost = posts.find(p => p.status === "draft") || posts[0] || null;
    }

    function showToast(message, bad = false) {
      const node = $("toast"); node.textContent = message; node.className = "toast" + (bad ? " bad" : "");
      clearTimeout(toastTimer); toastTimer = setTimeout(() => node.className = "toast hidden", 4800);
    }

    function statusLabel(status) { return ({draft:"Borrador", approved:"Aprobado", scheduled:"Programado", published:"Publicado", publishing:"Publicando", failed:"Error"}[status] || status || "Borrador"); }
    function postMedia(postId) { return media.filter(m => m.post_id === postId).sort((a,b) => (a.display_order || 1) - (b.display_order || 1)); }
    async function signedUrl(path) {
      if (!path) return "";
      try {
        const encoded = path.split("/").map(encodeURIComponent).join("/");
        const data = await request("/storage/v1/object/sign/project_files/" + encoded, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ expiresIn:3600 }) });
        return data?.signedURL?.startsWith("http") ? data.signedURL : SUPABASE_URL + (data?.signedURL || "");
      } catch { return ""; }
    }

    function render() {
      $("loginView").classList.toggle("hidden", Boolean(user));
      $("appView").classList.toggle("hidden", !user);
      if (!user) return;
      $("accountEmail").textContent = user.email || "Cuenta interna";
      $("avatar").textContent = (user.email || "IV").slice(0,2).toUpperCase();
      document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("active", b.dataset.view === currentView));
      if (currentView === "composer") renderComposer();
      if (currentView === "drafts") renderDrafts();
      if (currentView === "calendar") renderCalendar();
      if (currentView === "materials") renderMaterials();
    }

    function renderComposer() {
      const p = activePost || { id:"", internal_title:"", body:"", status:"draft", scheduled_at:"" };
      const image = activeImage || postMedia(p.id)[0];
      $("mainContent").innerHTML = `
        <div class="page-head"><div><p class="eyebrow">LinkedIn · Lilian Trade</p><h2>Crear publicación</h2><div class="subtle">Revisa el contenido antes de aprobarlo y publicarlo.</div></div><div class="actions"><button id="newBtn" class="secondary">Nuevo borrador</button><button id="saveBtn" class="secondary">Guardar borrador</button><button id="approveBtn" class="primary">Aprobar y publicar</button></div></div>
        <div class="workspace">
          <section class="panel"><div class="panel-head"><h3>Editor</h3><span class="status ${esc(p.status)}">${esc(statusLabel(p.status))}</span></div><div class="panel-body">
            <label for="postTitle">Título interno</label><input id="postTitle" value="${esc(p.internal_title)}" placeholder="Ej. Inspección de producto en origen">
            <label for="postBody">Texto de la publicación</label><textarea id="postBody" maxlength="3000" placeholder="Escribe el contenido que aparecerá en LinkedIn...">${esc(p.body)}</textarea><div class="counter"><span id="counter">${String(p.body || "").length}</span>/3000</div>
            <label>Material visual</label><label class="drop" for="fileInput"><span class="drop-icon">＋</span><span><strong>Subir foto o material</strong><br><small class="subtle">JPG, PNG o GIF · máximo 20 MB</small></span><input id="fileInput" type="file" accept="image/jpeg,image/png,image/gif"></label>
            ${image ? `<div class="material"><img id="editorImage" src="" alt="Material del post"><div class="material-title"><strong>${esc(image.source_path || image.cached_storage_path || "Imagen seleccionada")}</strong><span>${esc(image.alt_text || "Sin texto alternativo")}</span></div><button id="removeImage" class="danger">Quitar</button></div>` : ""}
            <div class="field-row"><div><label for="scheduledAt">Programar para</label><input id="scheduledAt" type="datetime-local" value="${p.scheduled_at ? new Date(p.scheduled_at).toISOString().slice(0,16) : ""}"></div><div><label for="altText">Texto alternativo</label><input id="altText" value="${esc(image?.alt_text || "")}" placeholder="Describe la imagen"></div></div>
          </div></section>
          <section class="panel"><div class="panel-head"><h3>Vista previa</h3><span class="subtle">Así se verá en LinkedIn</span></div><div class="preview-wrap"><article class="linkedin-card"><div class="li-head"><div class="li-logo">LT</div><div><div class="li-name">Lilian Trade</div><div class="li-meta">Ahora · 🌐</div></div></div><div id="previewBody" class="li-body">${esc(p.body || "Tu texto aparecerá aquí...")}</div><div id="previewImage" class="li-image li-placeholder">Agrega una imagen para verla aquí</div><div class="li-actions"><span>♡ Me gusta</span><span>◌ Comentar</span><span>↗ Compartir</span></div></article></div></section>
        </div>
        <section class="panel list-panel"><div class="panel-head"><h3>Últimos borradores</h3><button id="openDrafts" class="secondary">Ver todos</button></div><div id="recentPosts" class="post-list"></div></section>`;
      bindComposer();
      renderRecentPosts();
      hydrateImage(image);
    }

    async function hydrateImage(image) {
      if (!image) return;
      const src = image.preview_url || await signedUrl(image.cached_storage_path || image.source_path);
      if (src) { const editor = $("editorImage"); if (editor) editor.src = src; const preview = $("previewImage"); if (preview) preview.outerHTML = `<img id="previewImage" class="li-image" src="${esc(src)}" alt="${esc(image.alt_text || "")}">`; }
    }

    function bindComposer() {
      const body = $("postBody"); body?.addEventListener("input", () => { $("counter").textContent = body.value.length; $("previewBody").textContent = body.value || "Tu texto aparecerá aquí..."; });
      $("newBtn")?.addEventListener("click", () => { activePost = null; activeImage = null; render(); });
      $("saveBtn")?.addEventListener("click", () => saveDraft(false));
      $("approveBtn")?.addEventListener("click", () => saveDraft(true));
      $("openDrafts")?.addEventListener("click", () => { currentView = "drafts"; render(); });
      $("fileInput")?.addEventListener("change", (event) => { const file = event.target.files?.[0]; if (file) { activeImage = { localFile:file, alt_text:"" }; render(); } });
      $("removeImage")?.addEventListener("click", () => { activeImage = null; render(); });
    }

    async function uploadMaterial(file, postId, altText) {
      const safe = file.name.toLowerCase().replace(/[^a-z0-9._-]+/g, "-");
      const path = `social_media/${user.id}/${Date.now()}-${safe}`;
      await request("/storage/v1/object/project_files/" + path.split("/").map(encodeURIComponent).join("/"), { method:"POST", headers:{ "Content-Type":file.type, "x-upsert":"false" }, body:file });
      const row = await request("/rest/v1/social_media", { method:"POST", headers:{ "Content-Type":"application/json", Prefer:"return=representation" }, body:JSON.stringify({ post_id:postId, source_provider:"supabase", cached_storage_path:path, mime_type:file.type, alt_text:altText || null, display_order:1 }) });
      const item = row?.[0] || row; media.unshift(item); return item;
    }

    async function saveDraft(approve) {
      const title = $("postTitle")?.value.trim() || "Sin título";
      const body = $("postBody")?.value.trim() || "";
      const scheduled = $("scheduledAt")?.value ? new Date($("scheduledAt").value).toISOString() : null;
      const altText = $("altText")?.value.trim() || null;
      if (!body) return showToast("Escribe el texto de la publicación primero.", true);
      try {
        const account = accounts.find(a => a.display_name === ORG_NAME) || accounts[0];
        if (!account) throw new Error("No hay una cuenta de LinkedIn configurada.");
        let post;
        if (activePost?.id) {
          const result = await request("/rest/v1/social_posts?id=eq." + encodeURIComponent(activePost.id), { method:"PATCH", headers:{ "Content-Type":"application/json", Prefer:"return=representation" }, body:JSON.stringify({ internal_title:title, body, status:approve ? "approved" : (scheduled ? "scheduled" : "draft"), scheduled_at:scheduled, current_version:(activePost.current_version || 1) + 1 }) }); post = result?.[0] || activePost;
          const version = await request("/rest/v1/social_post_versions", { method:"POST", headers:{ "Content-Type":"application/json", Prefer:"return=representation" }, body:JSON.stringify({ post_id:post.id, version_number:post.current_version, body_snapshot:body, media_snapshot:[], created_by_user:user.id }) });
        } else {
          const result = await request("/rest/v1/social_posts", { method:"POST", headers:{ "Content-Type":"application/json", Prefer:"return=representation" }, body:JSON.stringify({ platform:"linkedin", social_account_id:account.id, internal_title:title, body, status:approve ? "approved" : (scheduled ? "scheduled" : "draft"), current_version:1, scheduled_at:scheduled, created_by_user:user.id }) }); post = result?.[0];
          await request("/rest/v1/social_post_versions", { method:"POST", headers:{ "Content-Type":"application/json", Prefer:"return=representation" }, body:JSON.stringify({ post_id:post.id, version_number:1, body_snapshot:body, media_snapshot:[], created_by_user:user.id }) });
        }
        activePost = post;
        if (activeImage?.localFile) { const uploaded = await uploadMaterial(activeImage.localFile, post.id, altText); uploaded.preview_url = URL.createObjectURL(activeImage.localFile); activeImage = uploaded; }
        if (approve) { await request("/rest/v1/social_approvals", { method:"POST", headers:{ "Content-Type":"application/json", Prefer:"return=representation" }, body:JSON.stringify({ post_id:post.id, version_number:post.current_version || 1, decision:"approved", decided_by:user.id }) });
          if (scheduled) { showToast("Aprobado y guardado en el calendario."); } else { await publish(post.id, activeImage, altText); }
        } else showToast(scheduled ? "Borrador guardado en el calendario." : "Borrador guardado.");
        await loadData(); render();
      } catch (error) { showToast(error.message, true); }
    }

    async function publish(postId, image, altText) {
      const imageUrl = image?.preview_url || await signedUrl(image?.cached_storage_path || image?.source_path);
      const response = await fetch(FUNCTION_BASE + "/social-publish-linkedin", { method:"POST", headers:{ ...apiHeaders({ "Content-Type":"application/json" }) }, body:JSON.stringify({ post_id:postId, image_url:imageUrl || "", alt_text:altText || image?.alt_text || "" }) });
      const data = await response.json().catch(() => null);
      if (!response.ok || !data?.ok) throw new Error(data?.error || "LinkedIn no pudo publicar el post.");
      showToast("Publicado en LinkedIn correctamente.");
    }

    function renderRecentPosts() { const list = $("recentPosts"); if (!list) return; const recent = posts.filter(p => p.status !== "published").slice(0,4); list.innerHTML = recent.length ? recent.map(p => `<div class="post-row"><div><div class="post-title">${esc(p.internal_title)}</div><div class="post-date">Actualizado ${esc(fmt(p.updated_at))}</div></div><span class="status ${esc(p.status)}">${esc(statusLabel(p.status))}</span><button data-post="${esc(p.id)}">Abrir</button></div>`).join("") : `<div class="empty">Todavía no hay borradores.</div>`; list.querySelectorAll("button[data-post]").forEach(b => b.addEventListener("click", () => { activePost = posts.find(p => p.id === b.dataset.post); activeImage = null; currentView = "composer"; render(); })); }
    function renderDrafts() { $("mainContent").innerHTML = `<div class="page-head"><div><p class="eyebrow">Biblioteca editorial</p><h2>Borradores</h2><div class="subtle">Contenido pendiente de revisión o publicación.</div></div><div class="actions"><button id="newDraft" class="primary">Nuevo borrador</button></div></div><section class="panel"><div id="draftList" class="post-list"></div></section>`; const list=$("draftList"); const items=posts.filter(p=>p.status!=="published"); list.innerHTML=items.length?items.map(p=>`<div class="post-row"><div><div class="post-title">${esc(p.internal_title)}</div><div class="post-date">${esc(fmt(p.updated_at))}</div></div><span class="status ${esc(p.status)}">${esc(statusLabel(p.status))}</span><button data-post="${esc(p.id)}">Abrir</button></div>`).join(""):`<div class="empty">No hay borradores todavía.</div>`; list.querySelectorAll("button[data-post]").forEach(b=>b.addEventListener("click",()=>{activePost=posts.find(p=>p.id===b.dataset.post);activeImage=null;currentView="composer";render();})); $("newDraft").addEventListener("click",()=>{activePost=null;activeImage=null;currentView="composer";render();}); }
    function renderCalendar() { const days=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"]; const now=new Date(); const start=new Date(now.getFullYear(),now.getMonth(),1); const offset=(start.getDay()+6)%7; const total=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(); let cells=days.map(d=>`<div class="day" style="min-height:44px;font-weight:750;color:#6b778c">${d}</div>`).join(""); for(let i=0;i<offset;i++) cells+=`<div class="day"></div>`; for(let d=1;d<=total;d++){const date=new Date(now.getFullYear(),now.getMonth(),d);const matches=posts.filter(p=>p.scheduled_at&&new Date(p.scheduled_at).toDateString()===date.toDateString());cells+=`<div class="day"><div class="day-number">${d}</div>${matches.map(p=>`<div class="event" data-post="${esc(p.id)}">${esc(p.internal_title)}</div>`).join("")}</div>`;} $("mainContent").innerHTML=`<div class="page-head"><div><p class="eyebrow">Planificación</p><h2>Calendario</h2><div class="subtle">Publicaciones programadas para Lilian Trade.</div></div><button id="calendarNew" class="primary">Programar publicación</button></div><div class="calendar">${cells}</div>`; $("calendarNew").addEventListener("click",()=>{activePost=null;activeImage=null;currentView="composer";render();}); document.querySelectorAll(".event").forEach(e=>e.addEventListener("click",()=>{activePost=posts.find(p=>p.id===e.dataset.post);currentView="composer";render();})); }
    function renderMaterials() { const items=media; $("mainContent").innerHTML=`<div class="page-head"><div><p class="eyebrow">Biblioteca visual</p><h2>Materiales</h2><div class="subtle">Fotos y archivos visuales disponibles para las publicaciones.</div></div><button id="materialNew" class="primary">Usar en publicación</button></div><section class="panel"><div class="panel-body">${items.length?items.map(m=>`<div class="material"><img data-media="${esc(m.id)}" src="" alt="${esc(m.alt_text||"")}"><div class="material-title"><strong>${esc(m.source_path||m.cached_storage_path||"Material")}</strong><span>${esc(m.alt_text||"Sin texto alternativo")}</span></div><button class="secondary" data-use="${esc(m.id)}">Usar</button></div>`).join(""):`<div class="empty">Aún no hay materiales cargados.</div>`}</div></section>`; items.forEach(async m=>{const img=document.querySelector(`img[data-media="${m.id}"]`);const src=await signedUrl(m.cached_storage_path||m.source_path);if(img&&src)img.src=src;}); document.querySelectorAll("button[data-use]").forEach(b=>b.addEventListener("click",()=>{activeImage=media.find(m=>m.id===b.dataset.use);currentView="composer";render();})); $("materialNew").addEventListener("click",()=>{activePost=null;activeImage=null;currentView="composer";render();}); }

    $("loginForm").addEventListener("submit", async (event) => { event.preventDefault(); $("loginError").classList.add("hidden"); try { await login($("email").value.trim(), $("password").value); await loadData(); render(); } catch(error) { $("loginError").textContent=error.message; $("loginError").classList.remove("hidden"); } });
    $("logoutBtn").addEventListener("click",()=>{session=null;user=null;localStorage.removeItem(SESSION_KEY);render();});
    document.querySelectorAll(".nav button").forEach(button=>button.addEventListener("click",()=>{currentView=button.dataset.view;render();}));
    (async()=>{ if(await restoreSession()){ try{await loadData();}catch(error){showToast(error.message,true);} } render(); })();
  </script>
</body>
</html>
